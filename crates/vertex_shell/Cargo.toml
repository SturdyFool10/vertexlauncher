[package]
name = "vertex_shell"
version.workspace = true
edition = "2024"

[dependencies]
# Pinned by rev: the engine's CMake build lives in OUT_DIR, so a moving branch would rebuild it needlessly.
sturdy = { git = "https://github.com/sturdyfool10/sturdyengine5", rev = "9d3f49e83baf0ce1630bb77286690ad916764382", features = ["raw-window-handle", "webgpu", "prebuilt-deps"] }
tracing.workspace = true
config.workspace = true
vertex_theme.workspace = true

# cxx builds its runtime as C++11 by default, which MSVC's standard library headers reject (they need C++14+), so the
# Windows cross-builds fail in cxx's build script. Unifies into the engine's cxx dependency.
[target.'cfg(windows)'.dependencies]
cxx = { version = "1", features = ["c++20"] }
