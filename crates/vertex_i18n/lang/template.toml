# Vertex Launcher language template.
# Copy this file to `<tag>.toml` (for example `es.toml`), fill in [language], and translate the messages below.
# Leave a message empty to keep showing it in English. Keep every {placeholder} exactly as written (you may move
# or repeat them); see README.md in this folder. This file is generated: `cargo run -p vertex_i18n --bin extract -- --write`.

[language]
tag = ""
name = ""
native_name = ""
right_to_left = false
translators = []

# [locale] is optional: it describes how the language counts, joins lists and writes numbers. See README.md.

