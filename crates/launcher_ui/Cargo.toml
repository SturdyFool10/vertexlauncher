[package]
name = "launcher_ui"
version.workspace = true
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
log_redaction.workspace = true
app_paths.workspace = true
vertex_theme.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
content_resolver.workspace = true
config.workspace = true
vertex_i18n.workspace = true
instance_sync.workspace = true
mc_options.workspace = true
instances.workspace = true
installation.workspace = true
managed_content.workspace = true
modprovider.workspace = true
modrinth.workspace = true
curseforge.workspace = true
launcher_runtime.workspace = true
shared_lru.workspace = true
toml.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
auth.workspace = true
image.workspace = true
resvg = "0.45"
bytemuck = { version = "1.25", features = ["derive"] }
ureq.workspace = true
flate2 = "1.1"
base64.workspace = true
qrcode.workspace = true
tar = "0.4"
xz2 = "0.1"
vtmpack.workspace = true
humantime.workspace = true
regex = "1"
ansi_escapers = { git = "https://github.com/SturdyFool10/ANSIEscapeRS" }
colorlab.workspace = true
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", default-features = false, features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
