[package]
name = "skin_gpu"
version.workspace = true
edition = "2024"

[dependencies]
# Pinned by rev, like vertex_shell: the engine's CMake build lives in OUT_DIR.
sturdy = { git = "https://github.com/sturdyfool10/sturdyengine5", rev = "d8046607319e2ed43ea973b3f3546fecfaa84e5e", features = ["raw-window-handle", "webgpu", "prebuilt-deps"] }
launcher_ui.workspace = true
config.workspace = true
image.workspace = true
tracing.workspace = true
app_paths.workspace = true

[target.'cfg(windows)'.dependencies]
cxx = { version = "1", features = ["c++20"] }
