[package]
name = "vertexlauncher"
version.workspace = true
edition = "2024"
rust-version = "1.92"
build = "build.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
logged_fs.workspace = true
log_redaction.workspace = true
app_paths.workspace = true
fontloader.workspace = true
config.workspace = true
auth.workspace = true
content_resolver.workspace = true
instance_sync.workspace = true
instances.workspace = true
installation.workspace = true
launcher_runtime.workspace = true
launcher_ui.workspace = true
managed_content.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
humantime.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
modrinth.workspace = true
curseforge.workspace = true
image.workspace = true
flate2 = "1.1"
ureq.workspace = true
tar = "0.4"
xz2 = "0.1"
vtmpack.workspace = true
vertex_constants.workspace = true
zip = { version = "8.6", default-features = false, features = ["deflate"] }
discord-rich-presence = "1.1.0"
gilrs.workspace = true
regex = "1"
vertex_shell.workspace = true
vertex_theme.workspace = true
# The binary forwards the engine's native link directives to Cargo so they reach the final link.
sturdy-sys = { git = "https://github.com/sturdyfool10/sturdyengine5", rev = "0ffd216ee88744f1a98b3051a4216290f2615e17" }

[target.'cfg(target_os = "windows")'.dependencies]
wry = "=0.31.1"
tao = "=0.22.0"
raw-window-handle = "0.6.2"
windows = { version = "=0.37.0", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Shell"] }


[target.'cfg(target_os = "linux")'.dependencies]
wry = "=0.31.1"
tao = "=0.22.0"


[target.'cfg(target_os = "macos")'.dependencies]
wry = "=0.31.1"
tao = "=0.22.0"
objc = "0.2"


[build-dependencies]
image.workspace = true
winresource = "0.1"
