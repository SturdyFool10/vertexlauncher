[workspace]
resolver = "3"
members = [
    "crates/app_paths",
    "crates/auth",
    "crates/config",
    "crates/content_resolver",
    "crates/curseforge",
    "crates/fontloader",
    "crates/installation",
    "crates/managed_content",
    "crates/instance_sync",
    "crates/mc_options",
    "crates/instances",
    "crates/log_redaction",
    "crates/logged_fs",
    "crates/launcher_runtime",
    "crates/launcher_ui",
    "crates/vertexlauncher",
    "crates/modprovider",
    "crates/modrinth",
    "crates/shared_lru",
    "crates/vertex_constants",
    "crates/vtmpack",
    "crates/skin_gpu",
    "crates/vertex_shell",
    "crates/vertex_theme",
]
default-members = [
    "crates/vertexlauncher",
]

[workspace.package]
# The one place the app version lives; every crate inherits it with `version.workspace = true`.
version = "0.1.25-Alpha"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
fontdb = "0.23.0"
thiserror = "1.0.69"
toml = "0.8.23"
serde_json = "1.0.149"
humantime = "2.3.0"
directories = "6.0.0"
image = "0.24.9"
pulldown-cmark = "0.13.3"
syntect = "5.3.0"
base64 = "0.22.1"
raw-window-handle = "0.6.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
url = "2.5.8"
ureq = { version = "3.3.0", features = ["json"] }
qrcode = "0.14"
gilrs = "0.11"
rustc-hash = "2.1.1"
colorlab = { git = "https://github.com/SturdyFool10/ColorLab" }

# internal crates
app_paths = { path = "crates/app_paths" }
auth = { path = "crates/auth" }
config = { path = "crates/config" }
content_resolver = { path = "crates/content_resolver" }
curseforge = { path = "crates/curseforge" }
installation = { path = "crates/installation" }
instance_sync = { path = "crates/instance_sync" }
mc_options = { path = "crates/mc_options" }
instances = { path = "crates/instances" }
log_redaction = { path = "crates/log_redaction" }
logged_fs = { path = "crates/logged_fs" }
launcher_runtime = { path = "crates/launcher_runtime" }
launcher_ui = { path = "crates/launcher_ui" }
skin_gpu = { path = "crates/skin_gpu" }
managed_content = { path = "crates/managed_content" }
modrinth = { path = "crates/modrinth" }
modprovider = { path = "crates/modprovider" }
fontloader = { path = "crates/fontloader" }
shared_lru = { path = "crates/shared_lru" }
vtmpack = { path = "crates/vtmpack" }
vertex_shell = { path = "crates/vertex_shell" }
vertex_theme = { path = "crates/vertex_theme" }
vertex_constants = { path = "crates/vertex_constants" }

[profile.dev]
# Your crates (workspace members): keep normal dev behavior
opt-level = 0
debug = 2
incremental = true
codegen-units = 256

[profile.dev.package."*"]
# All dependencies (everything not in your workspace): optimize hard
opt-level = 3
debug = 1
incremental = true
codegen-units = 16


# Everything except the launcher's own app logic (`vertexlauncher`) is optimised in dev builds: the engine glue, the
# skin rasteriser, scanners, installers and the rest. Only the app logic stays at opt-level 0 for debugging.
[profile.dev.package.launcher_ui]
opt-level = 3

[profile.dev.package.vertex_shell]
opt-level = 3

[profile.dev.package.vertex_theme]
opt-level = 3

[profile.dev.package.config]
opt-level = 3

[profile.dev.package.mc_options]
opt-level = 3

[profile.dev.package.installation]
opt-level = 3

[profile.dev.package.instances]
opt-level = 3

[profile.dev.package.instance_sync]
opt-level = 3

[profile.dev.package.content_resolver]
opt-level = 3

[profile.dev.package.vtmpack]
opt-level = 3

[profile.dev.package.modrinth]
opt-level = 3

[profile.dev.package.curseforge]
opt-level = 3

[profile.dev.package.modprovider]
opt-level = 3

[profile.dev.package.managed_content]
opt-level = 3

[profile.dev.package.auth]
opt-level = 3

[profile.dev.package.fontloader]
opt-level = 3

[profile.dev.package.shared_lru]
opt-level = 3

[profile.dev.package.launcher_runtime]
opt-level = 3

[profile.dev.package.app_paths]
opt-level = 3

[profile.dev.package.logged_fs]
opt-level = 3

[profile.dev.package.log_redaction]
opt-level = 3

[profile.dev.package.vertex_constants]
opt-level = 3

[profile.release]
debug = true
